name: Weekly Babbel analysis

on:
  schedule:
    # 03:00 NL-tijd in de zomer (CEST = UTC+2). In de winter is dit 02:00 NL.
    # GitHub Actions cron is altijd UTC en houdt geen rekening met DST.
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.15.12

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Fetch stories
        env:
          BABBEL_USERNAME: ${{ secrets.BABBEL_USERNAME }}
          BABBEL_PASSWORD: ${{ secrets.BABBEL_PASSWORD }}
        run: python3 fetch_all.py

      - name: Analyse
        run: python3 analyze.py

      - name: Update README (table + chart)
        run: python3 update_readme.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly.json README.md chart-buckets.svg chart-words.svg
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update weekly stats"
            git push
          fi
